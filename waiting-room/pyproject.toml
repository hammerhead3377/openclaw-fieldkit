[project]
name = "waiting-room"
version = "0.1.0"
description = "Lighthouse Spring — Auth gate and model router for OpenClaw fleet"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.28.0",
]

[project.scripts]
waiting-room = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
